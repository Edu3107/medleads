<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISA Digital — Quero me inscrever</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8B6914;--bg:#0A0A0B;--surface:#16161A;--border:rgba(201,168,76,.15);--border2:rgba(255,255,255,.06);--text:#F0EDE6;--text3:#6B6760;--radius:10px;--radius-lg:16px}
html,body{min-height:100vh;background:#0A0A0B;color:var(--text);font-family:"DM Sans",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:480px}
.logo-area{text-align:center;margin-bottom:32px}
.logo-area img{width:80px;height:80px;display:block;margin:0 auto}
.logo-name{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:700;color:#E8C97A;margin-top:8px}
.logo-sub{font-size:13px;color:#6B6760;margin-top:4px}
.card{background:#16161A;border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:36px 32px}
.card h2{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:#F0EDE6;margin-bottom:6px}
.card>p{font-size:13px;color:#6B6760;margin-bottom:24px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6760;margin-bottom:7px}
.field input,.field select{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;color:#F0EDE6;font-family:"DM Sans",sans-serif;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:#C9A84C}
.field input::placeholder{color:#6B6760}
.field select option{background:#1a1a1e}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{width:100%;background:linear-gradient(135deg,#8B6914,#C9A84C);border:none;border-radius:10px;padding:14px;color:#0A0A0B;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{display:none;background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:12px}
.ok{display:none;text-align:center;padding:24px}
.ok .ico{font-size:48px;margin-bottom:16px}
.ok h3{font-family:"Cormorant Garamond",serif;font-size:22px;color:#E8C97A;margin-bottom:8px}
.ok p{font-size:13px;color:#6B6760;line-height:1.6}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#6B6760}
.footer a{color:#C9A84C;text-decoration:none}
@media(max-width:480px){.card{padding:24px 20px}.row2{grid-template-columns:1fr}}
</style>
</head>

<script>
// Partículas
(function(){
  var cv=document.getElementById("bg"),ctx=cv.getContext("2d");
  function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();
  window.addEventListener("resize",rs);
  var G=[[201,168,76],[240,201,107],[184,136,46]],pts=[];
  for(var i=0;i<60;i++)pts.push(np(true));
  function np(init){return{x:Math.random()*cv.width,y:init?Math.random()*cv.height:cv.height+10,r:Math.random()*1.2+.3,s:Math.random()*.3+.08,d:(Math.random()-.5)*.2,life:0,max:Math.random()*300+150,c:G[0|Math.random()*3],a:0}}
  function lp(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];p.y-=p.s;p.x+=p.d;p.life++;
      var t=p.life/p.max;p.a=t<.15?t/.15:t>.75?(1-t)/.25:1;
      if(p.life>=p.max||p.y<-10)pts[i]=np(false);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle="rgba("+p.c[0]+","+p.c[1]+","+p.c[2]+","+p.a*.4+")";ctx.fill();
    }
    requestAnimationFrame(lp);
  }lp();
})();

// Enviar lead via Firestore REST API (sem SDK)
function enviar(){
  var n=document.getElementById("f-nome").value.trim();
  var e=document.getElementById("f-email").value.trim();
  var w=document.getElementById("f-whats").value.trim();
  var c=document.getElementById("f-curso").value;
  var errEl=document.getElementById("err");
  errEl.style.display="none";
  if(!n||!e||!w||!c){errEl.textContent="Preencha todos os campos obrigatórios (*)";errEl.style.display="block";return;}
  var btn=document.getElementById("btnSubmit");
  btn.disabled=true;btn.textContent="Enviando...";

  var body=JSON.stringify({
    fields:{
      nome:{stringValue:n},
      email:{stringValue:e},
      whats:{stringValue:w},
      crm:{stringValue:document.getElementById("f-crm").value},
      spec:{stringValue:document.getElementById("f-spec").value},
      cidade:{stringValue:document.getElementById("f-cidade").value},
      curso:{stringValue:c},
      status:{stringValue:"Novo"},
      origem:{stringValue:"Formulário Web"},
      valor:{integerValue:0},
      score:{integerValue:50},
      contato:{stringValue:"Hoje"},
      obs:{stringValue:"Lead captado via formulário público."},
      sincronizado:{booleanValue:false},
      criadoEm:{stringValue:new Date().toISOString()}
    }
  });

  fetch("https://firestore.googleapis.com/v1/projects/medleads-ad333/databases/(default)/documents/leads_pendentes?key=AIzaSyDrgyPcmwHmXskuQly8sKZvNhM-F0MdDto",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:body
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error(d.error ? d.error.message : "Erro "+r.status);
      return d;
    });
  }).then(function(){
    document.getElementById("formArea").style.display="none";
    document.getElementById("ok").style.display="block";
  }).catch(function(err){
    errEl.textContent="Erro: "+err.message+". Verifique as regras do Firestore.";
    errEl.style.display="block";
    btn.disabled=false;btn.textContent="Quero ser contactado →";
  });
}
</script>
